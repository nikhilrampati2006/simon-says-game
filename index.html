<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>Simon Says Game</h3>
    <h4>Press any key to start the game</h4>
     
    <div class="btn-conatiner">
        <div class="line-one">
            <div class="btn palevioletred" type="button" id="palevioletred">1</div>
            <div class="btn lightseagreen" type="button" id ="lightseagreen">2</div>
           
        </div>
        <div class="line-two">
            <div class="btn orange" type="button" id="orange">3</div>
            <div class="btn lightskyblue"  type="button" id="lightskyblue">4</div>
        </div>
        
    </div>
    <script src="app.js"></script>
</body>
</html>
